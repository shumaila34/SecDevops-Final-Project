name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    # CHANGE: Using GitHub's runner instead of self-hosted
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Backend Steps
      - name: Install backend dependencies
        run: |
          cd backend/Ecommerce-Web-App-server
          npm ci
      
      - name: Run backend tests
        run: |
          cd backend/Ecommerce-Web-App-server
          # Added --passWithNoTests to ensure it doesn't fail if tests are missing
          npm test -- --coverage --passWithNoTests 

      # Frontend Steps
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run frontend tests
        run: |
          cd frontend
          # Added CI=true and watchAll=false to prevent hanging
          CI=true npm test -- --coverage --watchAll=false --passWithNoTests
