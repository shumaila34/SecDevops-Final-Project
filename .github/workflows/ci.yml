name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted   # <- Self-hosted runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache backend node modules
        uses: actions/cache@v4
        with:
          path: backend/Ecommerce-Web-App-server/node_modules
          key: ${{ runner.os }}-backend-node-${{ hashFiles('backend/Ecommerce-Web-App-server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-node-

      - name: Cache frontend node modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-frontend-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-

      - name: Install backend dependencies
        run: |
          cd backend/Ecommerce-Web-App-server
          npm ci
      - name: Run backend tests
        run: |
          cd backend/Ecommerce-Web-App-server
          npm test -- --coverage

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --coverage
