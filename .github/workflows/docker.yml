name: Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Build backend image
      - name: Build backend image
        run: |
          docker build -t shumylaa/evaluation_project-backend:latest ./backend/Ecommerce-Web-App-server

      # Step 4: Push backend image
      - name: Push backend image
        run: |
          docker push shumylaa/evaluation_project-backend:latest

      # Step 5: Build frontend image
      - name: Build frontend image
        run: |
          docker build -t shumylaa/evaluation_project-frontend:latest ./frontend

      # Step 6: Push frontend image
      - name: Push frontend image
        run: |
          docker push shumylaa/evaluation_project-frontend:latest
