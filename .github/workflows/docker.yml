name: Build & Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Backend image
      - name: Build backend image
        run: |
          docker build -t shumylaa/evaluation_project-backend:latest ./backend

      - name: Push backend image
        run: |
          docker push shumylaa/evaluation_project-backend:latest

      # Frontend image
      - name: Build frontend image
        run: |
          docker build -t shumylaa/evaluation_project-frontend:latest ./frontend

      - name: Push frontend image
        run: |
          docker push shumylaa/evaluation_project-frontend:latest
