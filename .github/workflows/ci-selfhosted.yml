name: CI - Self-Hosted (Best Practice)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    # Use labels to target self-hosted Linux runner with Node.js
    runs-on: [self-hosted, linux, node]

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3️⃣ Cache node modules
      - name: Cache Node Modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ Install dependencies
      - name: Install Dependencies
        run: npm ci

      # 5️⃣ Run tests (fail-fast)
      - name: Run Tests
        run: npm test -- --coverage
        continue-on-error: false   # workflow fails if tests fail

      # 6️⃣ Optional: Upload test coverage
      - name: Upload Coverage Artifact
        if: success()               # only upload if tests succeed
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: coverage/

      # 7️⃣ Use secrets (example)
      # - name: Example API call using secret
      #   run: curl -H "Authorization: Bearer $API_KEY" https://api.example.com/test
      #   env:
      #     API_KEY: ${{ secrets.API_KEY }}
