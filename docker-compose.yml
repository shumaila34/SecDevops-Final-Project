version: "3.9"

services:
  backend:
    build: ./backend/Ecommerce-Web-App-server
    ports:
      - "4000:4000"
    env_file:
      - ./backend/Ecommerce-Web-App-server/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
